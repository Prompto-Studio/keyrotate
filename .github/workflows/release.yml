name: Release

# Builds standalone binaries for macOS arm64, macOS x64, and Linux x64 on tag
# push. ALL builds happen on a single ubuntu-latest runner — Bun supports
# cross-compilation for every target via `bun build --compile --target=`, so we
# don't pay the macos queue tax or run extra runners just to produce binaries.
#
# Tarballs are attached to the GitHub Release; the Formula/keyrotate.rb is
# auto-rendered from the resulting SHA256s and attached to the release as well.
#
# To cut a release:
#   bun version patch && git push && git push --tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile

      - name: Cross-compile all three targets
        run: |
          mkdir -p dist
          for t in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64; do
            short=${t#bun-}
            echo "→ building $short"
            bun build src/cli.ts --compile --target=$t --outfile dist/keyrotate
            cd dist
            tar -czf "../keyrotate-${short}.tar.gz" keyrotate
            cd ..
            rm dist/keyrotate
          done
          ls -la keyrotate-*.tar.gz

      - name: Compute SHA256s
        id: sha
        run: |
          v_display="${GITHUB_REF_NAME#v}"
          # Map cosmetic 00.00.NN → semver 0.NN.0 so Homebrew's version comparison
          # can order upgrades. CLI/README still show v_display.
          last_seg="${v_display##*.}"; last_n=$((10#$last_seg))
          v_semver="0.${last_n}.0"
          echo "version=$v_semver"   >> $GITHUB_OUTPUT
          echo "v_display=$v_display" >> $GITHUB_OUTPUT
          for arch in darwin-arm64 darwin-x64 linux-x64; do
            sha=$(shasum -a 256 "keyrotate-${arch}.tar.gz" | awk '{print $1}')
            echo "sha_$(echo $arch | tr - _)=$sha" >> $GITHUB_OUTPUT
            echo "$arch: $sha"
          done

      - name: Render Formula
        run: |
          mkdir -p Formula
          cat > Formula/keyrotate.rb <<RUBY
          class Keyrotate < Formula
            desc "One-command API-key rotator — 1Password, GitHub, Supabase, Netlify, Fly.io, .env"
            homepage "https://github.com/${{ github.repository }}"
            version "${{ steps.sha.outputs.version }}"     # ${{ steps.sha.outputs.v_display }} (cosmetic)
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/keyrotate-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.sha_darwin_arm64 }}"
              end
              on_intel do
                url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/keyrotate-darwin-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.sha_darwin_x64 }}"
              end
            end

            on_linux do
              url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/keyrotate-linux-x64.tar.gz"
              sha256 "${{ steps.sha.outputs.sha_linux_x64 }}"
            end

            def install
              bin.install "keyrotate"
              bin.install_symlink bin/"keyrotate" => "kr"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/keyrotate version")
            end
          end
          RUBY
          cat Formula/keyrotate.rb

      - name: Attach all artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keyrotate-darwin-arm64.tar.gz
            keyrotate-darwin-x64.tar.gz
            keyrotate-linux-x64.tar.gz
            Formula/keyrotate.rb
          generate_release_notes: true
          fail_on_unmatched_files: true
