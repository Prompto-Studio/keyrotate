name: Release

# Builds standalone binaries for macOS arm64, macOS x64, Linux x64, and
# Windows x64 on tag push. ALL builds happen on a single ubuntu-latest runner —
# Bun cross-compiles to every target via `bun build --compile --target=`.
#
# Outputs:
#   - GitHub Release tarballs/zips for all 4 platforms
#   - Auto-rendered Homebrew Formula attached to the release
#   - npm publish of `keyrotate` + 4 platform packages
#
# To cut a release:
#   bun version patch && git push && git push --tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile

      - name: Inject version into src/cli.ts
        env:
          GH_REF: ${{ github.ref_name }}
        run: |
          v_display="${GH_REF#v}"
          # Replace the hardcoded VERSION constant with the real tag display.
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"${v_display}\";/" src/cli.ts
          grep "^const VERSION" src/cli.ts

      - name: Cross-compile all four targets
        run: |
          mkdir -p dist
          # POSIX targets → tar.gz (binary "keyrotate")
          for t in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64; do
            short=${t#bun-}
            echo "→ building $short"
            bun build src/cli.ts --compile --target=$t --outfile dist/keyrotate
            cd dist && tar -czf "../keyrotate-${short}.tar.gz" keyrotate && cd ..
            rm dist/keyrotate
          done
          # Windows target → zip (binary "keyrotate.exe")
          echo "→ building win32-x64"
          bun build src/cli.ts --compile --target=bun-windows-x64 --outfile dist/keyrotate.exe
          cd dist && zip -q "../keyrotate-win32-x64.zip" keyrotate.exe && cd ..
          rm dist/keyrotate.exe
          ls -la keyrotate-*

      - name: Compute SHA256s
        id: sha
        run: |
          v_display="${GITHUB_REF_NAME#v}"
          # Map cosmetic 00.00.NN → semver 0.NN.0 so Homebrew + npm semver order.
          last_seg="${v_display##*.}"; last_n=$((10#$last_seg))
          v_semver="0.${last_n}.0"
          echo "version=$v_semver"   >> $GITHUB_OUTPUT
          echo "v_display=$v_display" >> $GITHUB_OUTPUT
          for arch in darwin-arm64 darwin-x64 linux-x64; do
            sha=$(shasum -a 256 "keyrotate-${arch}.tar.gz" | awk '{print $1}')
            echo "sha_$(echo $arch | tr - _)=$sha" >> $GITHUB_OUTPUT
            echo "$arch: $sha"
          done
          sha_win=$(shasum -a 256 keyrotate-win32-x64.zip | awk '{print $1}')
          echo "sha_win32_x64=$sha_win" >> $GITHUB_OUTPUT
          echo "win32-x64: $sha_win"

      - name: Render Formula
        run: |
          mkdir -p Formula
          cat > Formula/keyrotate.rb <<RUBY
          class Keyrotate < Formula
            desc "One-command API-key rotator — 1Password, GitHub, Supabase, Netlify, Fly.io, .env"
            homepage "https://github.com/${{ github.repository }}"
            version "${{ steps.sha.outputs.version }}"     # ${{ steps.sha.outputs.v_display }} (cosmetic)
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/keyrotate-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.sha_darwin_arm64 }}"
              end
              on_intel do
                url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/keyrotate-darwin-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.sha_darwin_x64 }}"
              end
            end

            on_linux do
              url "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/keyrotate-linux-x64.tar.gz"
              sha256 "${{ steps.sha.outputs.sha_linux_x64 }}"
            end

            def install
              bin.install "keyrotate"
              bin.install_symlink bin/"keyrotate" => "kr"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/keyrotate version")
            end
          end
          RUBY
          cat Formula/keyrotate.rb

      - name: Attach all artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            keyrotate-darwin-arm64.tar.gz
            keyrotate-darwin-x64.tar.gz
            keyrotate-linux-x64.tar.gz
            keyrotate-win32-x64.zip
            Formula/keyrotate.rb
          generate_release_notes: true
          fail_on_unmatched_files: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Stage and publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V_SEMVER: ${{ steps.sha.outputs.version }}
          V_DISPLAY: ${{ steps.sha.outputs.v_display }}
        run: |
          set -euo pipefail
          mkdir -p _bins/darwin-arm64 _bins/darwin-x64 _bins/linux-x64 _bins/win32-x64
          for arch in darwin-arm64 darwin-x64 linux-x64; do
            tar -xzf "keyrotate-${arch}.tar.gz" -C "_bins/${arch}"
          done
          unzip -q keyrotate-win32-x64.zip -d _bins/win32-x64

          # Sync version across all 5 manifests
          for pkg in npm/keyrotate npm/keyrotate-darwin-arm64 npm/keyrotate-darwin-x64 npm/keyrotate-linux-x64 npm/keyrotate-win32-x64; do
            node -e "const f='${pkg}/package.json';const p=require('./'+f);p.version=process.env.V_SEMVER;if(p.optionalDependencies){for(const k of Object.keys(p.optionalDependencies))p.optionalDependencies[k]=process.env.V_SEMVER;}require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n');"
          done

          # POSIX binaries
          for arch in darwin-arm64 darwin-x64 linux-x64; do
            mkdir -p "npm/keyrotate-${arch}/bin"
            cp "_bins/${arch}/keyrotate" "npm/keyrotate-${arch}/bin/keyrotate"
            chmod +x "npm/keyrotate-${arch}/bin/keyrotate"
          done
          # Windows binary
          mkdir -p npm/keyrotate-win32-x64/bin
          cp _bins/win32-x64/keyrotate.exe npm/keyrotate-win32-x64/bin/keyrotate.exe

          for pkg in npm/keyrotate-darwin-arm64 npm/keyrotate-darwin-x64 npm/keyrotate-linux-x64 npm/keyrotate-win32-x64 npm/keyrotate; do
            echo "→ publishing $pkg"
            if [[ "$pkg" == "npm/keyrotate-win32-x64" ]]; then (cd "$pkg" && npm publish --access public) || echo "::warning::win32-x64 publish failed (likely npm spam filter); see issue tracker"; else (cd "$pkg" && npm publish --access public); fi
          done
